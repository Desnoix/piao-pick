name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 防止同一 PR 的多次 push 触发重复 CI 运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =============================================================================
  # 后端 CI
  # =============================================================================
  backend:
    name: Backend (lint / type / test)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. 缓存 pip 包
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py311-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-py311-

      # 4. 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # 5. Ruff lint 检查
      - name: Ruff lint check
        run: |
          cd backend
          ruff check .

      # 6. Ruff 格式检查（检查是否需要 ruff format）
      - name: Ruff format check
        run: |
          cd backend
          ruff format --check .
        continue-on-error: true   # 格式问题仅警告，不阻塞 CI

      # 7. mypy 类型检查
      - name: mypy type check
        run: |
          cd backend
          mypy .
        continue-on-error: true   # 初期宽松，逐步修复后改为 false

      # 8. pytest 单元测试（含覆盖率）
      - name: pytest with coverage
        run: |
          cd backend
          pytest tests/unit/ --cov=app --cov=data_provider --cov-report=term-missing --cov-report=xml:coverage.xml
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          DB_PATH: ":memory:"    # 测试使用内存 SQLite，不留文件
          TUSHARE_TOKEN: ""
          SCHEDULE_ENABLED: "false"

      # 9. 上传覆盖率报告（可选，用于 GitHub PR 评论）
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}   # 需要在仓库设置中添加 token
        continue-on-error: true                 # Codecov 上传失败不影响 CI 结果

  # =============================================================================
  # 前端 CI
  # =============================================================================
  frontend:
    name: Frontend (type / build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 Node.js
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 3. 缓存 npm 依赖
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: npm-${{ runner.os }}-node20-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node20-

      # 4. 安装前端依赖
      - name: Install dependencies
        working-directory: frontend
        run: |
          # 若无 package-lock.json，使用 npm install 生成
          if [ ! -f "package-lock.json" ]; then
            npm install
          else
            npm ci
          fi

      # 5. TypeScript 类型检查（独立于构建）
      - name: TypeScript type check
        working-directory: frontend
        run: npx vue-tsc -b --noEmit
        timeout-minutes: 5

      # 6. 生产构建（验证打包无错误）
      - name: Build production assets
        working-directory: frontend
        run: npm run build
        timeout-minutes: 10

      # 7. 上传构建产物（用于检查构建文件大小）
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # =============================================================================
  # CI 完成通知（所有 job 通过后触发）
  # =============================================================================
  ci-pass:
    name: CI Passed
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()   # 即使有 job 失败也运行，用于明确显示整体状态

    steps:
      - name: Check all jobs status
        run: |
          if [ "${{ needs.backend.result }}" = "success" ] && \
             [ "${{ needs.frontend.result }}" = "success" ]; then
            echo "All CI jobs passed!"
            exit 0
          else
            echo "CI failed:"
            echo "  Backend:  ${{ needs.backend.result }}"
            echo "  Frontend: ${{ needs.frontend.result }}"
            exit 1
          fi
